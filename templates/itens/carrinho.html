<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Carrinho</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a
                href="/api/produtos/pagina/"
                class="navbar-brand"
            >
                Minha Loja
            </a>

            <span
                id="userName"
                class="text-white"
            >
                Carregando usuário...
            </span>

        </div>

    </nav>


    <main class="container mt-5">

        <div
            class="
                d-flex
                justify-content-between
                align-items-center
                mb-4
            "
        >

            <h1>
                🛒 Meu Carrinho
            </h1>

            <a
                href="/api/produtos/pagina/"
                class="btn btn-outline-primary"
            >
                Continuar comprando
            </a>

        </div>


        <div id="cartContainer">

            <div class="text-center">
                Carregando carrinho...
            </div>

        </div>

    </main>


    <script>

        const cartContainer =
            document.getElementById(
                'cartContainer'
            );

        const userName =
            document.getElementById(
                'userName'
            );


        async function carregarUsuario() {

            const token =
                localStorage.getItem(
                    'access_token'
                );


            if (!token) {

                window.location.href = '/';

                return;

            }


            try {

                const response = await fetch(
                    '/api/auth/me/',
                    {
                        headers: {
                            'Authorization':
                                `Bearer ${token}`
                        }
                    }
                );


                if (!response.ok) {

                    localStorage.removeItem(
                        'access_token'
                    );

                    localStorage.removeItem(
                        'refresh_token'
                    );

                    window.location.href = '/';

                    return;

                }


                const usuario =
                    await response.json();


                userName.textContent =
                    `Olá, ${usuario.username}`;


            } catch (error) {

                console.error(error);

                window.location.href = '/';

            }

        }


        async function carregarCarrinho() {

            const token =
                localStorage.getItem(
                    'access_token'
                );


            if (!token) {

                window.location.href = '/';

                return;

            }


            cartContainer.innerHTML = `
                <div class="text-center">
                    Carregando carrinho...
                </div>
            `;


            try {

                const response = await fetch(
                    '/api/produtos/carrinho/',
                    {
                        headers: {
                            'Authorization':
                                `Bearer ${token}`
                        }
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    cartContainer.innerHTML = `
                        <div class="alert alert-danger">
                            Erro ao carregar carrinho.
                        </div>
                    `;

                    return;

                }


                if (data.itens.length === 0) {

                    cartContainer.innerHTML = `
                        <div class="alert alert-warning">
                            Seu carrinho está vazio.
                        </div>
                    `;

                    return;

                }


                cartContainer.innerHTML = '';


                let total = 0;


                data.itens.forEach(item => {

                    const produto =
                        item.produto_detalhes;

                    const subtotal =
                        parseFloat(
                            item.subtotal
                        );


                    total += subtotal;


                    const itemElement =
                        document.createElement(
                            'div'
                        );


                    itemElement.className =
                        'card mb-3 shadow-sm';


                    itemElement.innerHTML = `

                        <div class="card-body">

                            <div class="row align-items-center">

                                <div class="col-md-2">

                                    <img
                                        src="${produto.imagem}"
                                        alt="${produto.nome}"
                                        class="img-fluid"
                                        style="
                                            height: 100px;
                                            object-fit: contain;
                                        "
                                    >

                                </div>


                                <div class="col-md-4">

                                    <h5>
                                        ${produto.nome}
                                    </h5>

                                    <p class="text-muted mb-0">
                                        R$ ${produto.preco}
                                    </p>

                                </div>


                                <div class="col-md-2">

                                    <strong>
                                        Quantidade
                                    </strong>

                                    <div
                                        class="
                                            d-flex
                                            align-items-center
                                            gap-2
                                            mt-2
                                        "
                                    >

                                        <button
                                            class="
                                                btn
                                                btn-outline-secondary
                                                btn-sm
                                            "
                                            onclick="
                                                alterarQuantidade(
                                                    ${item.id},
                                                    ${item.quantidade - 1}
                                                )
                                            "
                                        >
                                            -
                                        </button>


                                        <span>
                                            ${item.quantidade}
                                        </span>


                                        <button
                                            class="
                                                btn
                                                btn-outline-secondary
                                                btn-sm
                                            "
                                            onclick="
                                                alterarQuantidade(
                                                    ${item.id},
                                                    ${item.quantidade + 1}
                                                )
                                            "
                                        >
                                            +
                                        </button>

                                    </div>

                                </div>


                                <div class="col-md-2">

                                    <strong>
                                        Subtotal
                                    </strong>

                                    <p class="mt-2">
                                        R$ ${subtotal.toFixed(2)}
                                    </p>

                                </div>


                                <div class="col-md-2">

                                    <button
                                        class="btn btn-danger"
                                        onclick="
                                            removerItem(
                                                ${item.id}
                                            )
                                        "
                                    >
                                        🗑 Remover
                                    </button>

                                </div>

                            </div>

                        </div>

                    `;


                    cartContainer
                        .appendChild(
                            itemElement
                        );

                });


                const totalElement =
                    document.createElement(
                        'div'
                    );


                totalElement.className =
                    'text-end mt-4';


                totalElement.innerHTML = `

                    <h3>
                        Total:
                        R$ ${total.toFixed(2)}
                    </h3>


                    <button
                        class="
                            btn
                            btn-success
                            btn-lg
                            mt-3
                        "
                    >
                        Finalizar compra
                    </button>

                `;


                cartContainer
                    .appendChild(
                        totalElement
                    );


            } catch (error) {

                console.error(error);


                cartContainer.innerHTML = `
                    <div class="alert alert-danger">
                        Não foi possível carregar o carrinho.
                    </div>
                `;

            }

        }


        async function removerItem(
            itemId
        ) {

            const token =
                localStorage.getItem(
                    'access_token'
                );


            if (!token) {

                window.location.href = '/';

                return;

            }


            try {

                const response = await fetch(
                    `/api/produtos/carrinho/item/${itemId}/remover/`,
                    {
                        method: 'DELETE',

                        headers: {
                            'Authorization':
                                `Bearer ${token}`
                        }
                    }
                );


                if (!response.ok) {

                    const data =
                        await response.json();


                    alert(
                        data.detail ||
                        'Erro ao remover item.'
                    );

                    return;

                }


                carregarCarrinho();


            } catch (error) {

                console.error(error);


                alert(
                    'Não foi possível remover o item.'
                );

            }

        }


        async function alterarQuantidade(
            itemId,
            quantidade
        ) {

            if (quantidade < 1) {

                return;

            }


            const token =
                localStorage.getItem(
                    'access_token'
                );


            if (!token) {

                window.location.href = '/';

                return;

            }


            try {

                const response = await fetch(
                    `/api/produtos/carrinho/item/${itemId}/quantidade/`,
                    {
                        method: 'PATCH',

                        headers: {

                            'Content-Type':
                                'application/json',

                            'Authorization':
                                `Bearer ${token}`

                        },

                        body: JSON.stringify({
                            quantidade: quantidade
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.detail ||
                        'Erro ao alterar quantidade.'
                    );

                    return;

                }


                carregarCarrinho();


            } catch (error) {

                console.error(error);


                alert(
                    'Não foi possível alterar a quantidade.'
                );

            }

        }


        carregarUsuario();

        carregarCarrinho();

    </script>

</body>

</html>
