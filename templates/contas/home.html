<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a
                href="/home/"
                class="navbar-brand"
            >
                Minha Loja
            </a>

            <div class="d-flex align-items-center gap-3">

                <span
                    id="userName"
                    class="text-white"
                >
                    Carregando usuário...
                </span>

                <button
                    id="logoutButton"
                    class="btn btn-outline-light"
                >
                    Sair
                </button>

            </div>

        </div>

    </nav>


    <main class="container mt-5">

        <div class="text-center mb-5">

            <h1>
                Bem-vindo à Minha Loja
            </h1>

            <p class="text-muted">
                Escolha uma opção para continuar.
            </p>

        </div>


        <div class="row justify-content-center g-4">

            <div class="col-md-4">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center">

                        <h3>
                            🛍️ Produtos
                        </h3>

                        <p class="text-muted">
                            Veja os produtos disponíveis na loja.
                        </p>

                        <a
                            href="/api/produtos/pagina/"
                            class="btn btn-primary"
                        >
                            Ver produtos
                        </a>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center">

                        <h3>
                            🛒 Carrinho
                        </h3>

                        <p class="text-muted">
                            Veja os produtos adicionados ao seu carrinho.
                        </p>

                        <a
                            href="/api/produtos/carrinho/pagina/"
                            class="btn btn-success"
                        >
                            Abrir carrinho
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script>

        const userName =
            document.getElementById(
                'userName'
            );

        const logoutButton =
            document.getElementById(
                'logoutButton'
            );


        async function carregarUsuario() {

            const token =
                localStorage.getItem(
                    'access_token'
                );

            if (!token) {

                window.location.href = '/';

                return;

            }

            try {

                const response = await fetch(
                    '/api/auth/me/',
                    {
                        headers: {
                            'Authorization':
                                `Bearer ${token}`
                        }
                    }
                );

                if (!response.ok) {

                    localStorage.removeItem(
                        'access_token'
                    );

                    localStorage.removeItem(
                        'refresh_token'
                    );

                    window.location.href = '/';

                    return;

                }

                const usuario =
                    await response.json();

                userName.textContent =
                    `Olá, ${usuario.username}`;

            } catch (error) {

                console.error(error);

                window.location.href = '/';

            }

        }


        logoutButton.addEventListener(
            'click',
            () => {

                localStorage.removeItem(
                    'access_token'
                );

                localStorage.removeItem(
                    'refresh_token'
                );

                window.location.href = '/';

            }
        );


        carregarUsuario();

    </script>

</body>

</html>
