<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produtos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a
                href="#"
                class="navbar-brand"
            >
                Minha Loja
            </a>

            <button class="btn btn-light">
                🛒 Carrinho
            </button>

        </div>

    </nav>


    <main class="container mt-5">

        <h1 class="mb-4">
            Produtos
        </h1>


        <form
            id="searchForm"
            class="mb-4"
        >

            <div class="input-group">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Pesquisar produto..."
                >

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Buscar
                </button>

            </div>

        </form>


        <div
            id="productsContainer"
            class="row g-4"
        >

            <div class="text-center">
                Carregando produtos...
            </div>

        </div>

    </main>


    <script>

        const productsContainer =
            document.getElementById('productsContainer');


        async function carregarProdutos(
            url = '/api/produtos/'
        ) {

            productsContainer.innerHTML = `
                <div class="text-center">
                    Carregando produtos...
                </div>
            `;


            try {

                const response = await fetch(url);

                const data = await response.json();


                if (!response.ok) {

                    productsContainer.innerHTML = `
                        <div class="alert alert-danger">
                            Erro ao carregar produtos.
                        </div>
                    `;

                    return;
                }


                productsContainer.innerHTML = '';


                if (data.length === 0) {

                    productsContainer.innerHTML = `
                        <div class="col-12">

                            <div class="alert alert-warning">

                                Nenhum produto encontrado.

                            </div>

                        </div>
                    `;

                    return;
                }


                data.forEach(produto => {

                    const card =
                        document.createElement('div');

                    card.className =
                        'col-md-4 col-lg-3';


                    card.innerHTML = `

                        <div class="card h-100 shadow-sm">

                            <img
                                src="${produto.imagem}"
                                class="card-img-top"
                                alt="${produto.nome}"
                                style="
                                    height: 200px;
                                    object-fit: contain;
                                "
                            >

                            <div
                                class="
                                    card-body
                                    d-flex
                                    flex-column
                                "
                            >

                                <h5 class="card-title">

                                    ${produto.nome}

                                </h5>


                                <p
                                    class="
                                        card-text
                                        text-muted
                                    "
                                >

                                    ${produto.descricao}

                                </p>


                                <h5 class="mt-auto">

                                    R$ ${produto.preco}

                                </h5>


                                <button
                                    class="
                                        btn
                                        btn-primary
                                        mt-2
                                    "
                                >

                                    Comprar

                                </button>

                            </div>

                        </div>

                    `;


                    productsContainer.appendChild(
                        card
                    );

                });


            } catch (error) {

                productsContainer.innerHTML = `
                    <div class="col-12">

                        <div class="alert alert-danger">

                            Não foi possível
                            conectar ao servidor.

                        </div>

                    </div>
                `;

                console.error(error);

            }

        }


        document
            .getElementById('searchForm')
            .addEventListener(
                'submit',
                event => {

                    event.preventDefault();


                    const search =
                        document
                            .getElementById(
                                'searchInput'
                            )
                            .value
                            .trim();


                    if (!search) {

                        carregarProdutos();

                        return;

                    }


                    const url =
                        `/api/produtos/?search=${
                            encodeURIComponent(search)
                        }`;


                    carregarProdutos(url);

                }
            );


        carregarProdutos();

    </script>

</body>

</html>
