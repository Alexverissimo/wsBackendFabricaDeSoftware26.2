<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produtos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a
                href="#"
                class="navbar-brand"
            >
                Minha Loja
            </a>

            <div class="d-flex align-items-center gap-3">

                <span
                    id="userName"
                    class="text-white"
                >
                    Carregando usuário...
                </span>
                    <a
                    href="/api/produtos/carrinho/pagina/"
                    class="btn btn-light"
                    >
                    🛒 Carrinho
                    </a>

                <button
                    id="logoutButton"
                    class="btn btn-danger"
                >
                    Sair
                </button>

            </div>

        </div>

    </nav>


    <!-- CONTEÚDO -->

    <main class="container mt-5">

        <h1 class="mb-4">
            Produtos
        </h1>


        <!-- PESQUISA -->

        <form
            id="searchForm"
            class="mb-4"
        >

            <div class="input-group">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Pesquisar produto..."
                >

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Buscar
                </button>

            </div>

        </form>


        <!-- PRODUTOS -->

        <div
            id="productsContainer"
            class="row g-4"
        >

            <div class="text-center">
                Carregando produtos...
            </div>

        </div>

    </main>


    <script>

        const productsContainer =
            document.getElementById(
                'productsContainer'
            );

        const userName =
            document.getElementById(
                'userName'
            );

        const logoutButton =
            document.getElementById(
                'logoutButton'
            );


        async function carregarUsuario() {

            const token =
                localStorage.getItem(
                    'access_token'
                );


            if (!token) {

                window.location.href = '/';

                return;

            }


            try {

                const response =
                    await fetch(
                        '/api/auth/me/',
                        {
                            headers: {

                                'Authorization':
                                    `Bearer ${token}`

                            }
                        }
                    );


                if (!response.ok) {

                    localStorage.removeItem(
                        'access_token'
                    );

                    localStorage.removeItem(
                        'refresh_token'
                    );

                    window.location.href = '/';

                    return;

                }


                const usuario =
                    await response.json();


                userName.textContent =
                    `Olá, ${usuario.username}`;


            } catch (error) {

                console.error(error);

                window.location.href = '/';

            }

        }


        // CARREGAR PRODUTOS

        async function carregarProdutos(
            url = '/api/produtos/'
        ) {

            productsContainer.innerHTML = `
                <div class="text-center">
                    Carregando produtos...
                </div>
            `;


            try {

                const response =
                    await fetch(url);

                const data =
                    await response.json();


                if (!response.ok) {

                    productsContainer.innerHTML = `
                        <div class="col-12">

                            <div class="alert alert-danger">
                                Erro ao carregar produtos.
                            </div>

                        </div>
                    `;

                    return;

                }


                productsContainer.innerHTML = '';


                if (data.length === 0) {

                    productsContainer.innerHTML = `
                        <div class="col-12">

                            <div class="alert alert-warning">
                                Nenhum produto encontrado.
                            </div>

                        </div>
                    `;

                    return;

                }


                data.forEach(produto => {

                    const card =
                        document.createElement(
                            'div'
                        );


                    card.className =
                        'col-md-4 col-lg-3';


                    card.innerHTML = `

                        <div
                            class="
                                card
                                h-100
                                shadow-sm
                            "
                        >

                            <img
                                src="${produto.imagem}"
                                class="card-img-top"
                                alt="${produto.nome}"
                                style="
                                    height: 200px;
                                    object-fit: contain;
                                "
                            >


                            <div
                                class="
                                    card-body
                                    d-flex
                                    flex-column
                                "
                            >

                                <h5 class="card-title">

                                    ${produto.nome}

                                </h5>


                                <p
                                    class="
                                        card-text
                                        text-muted
                                    "
                                >

                                    ${produto.descricao}

                                </p>


                                <h5 class="mt-auto">

                                    R$ ${produto.preco}

                                </h5>


                                <button
                                    class="
                                        btn
                                        btn-primary
                                        mt-2
                                    "
                                    onclick="
                                        adicionarCarrinho(
                                            ${produto.id}
                                        )
                                    "
                                >

                                    🛒 Adicionar ao carrinho

                                </button>

                            </div>

                        </div>

                    `;


                    productsContainer
                        .appendChild(card);

                });


            } catch (error) {

                productsContainer.innerHTML = `
                    <div class="col-12">

                        <div class="alert alert-danger">

                            Não foi possível
                            conectar ao servidor.

                        </div>

                    </div>
                `;


                console.error(error);

            }

        }


        async function adicionarCarrinho(
            produtoId
        ) {

            const token =
                localStorage.getItem(
                    'access_token'
                );


            if (!token) {

                window.location.href = '/';

                return;

            }


            try {

                const response =
                    await fetch(
                        '/api/produtos/carrinho/adicionar/',
                        {
                            method: 'POST',

                            headers: {

                                'Content-Type':
                                    'application/json',

                                'Authorization':
                                    `Bearer ${token}`

                            },

                            body: JSON.stringify({
                                produto_id: produtoId
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.detail ||
                        'Erro ao adicionar produto.'
                    );

                    return;

                }


                alert(
                    'Produto adicionado ao carrinho!'
                );


            } catch (error) {

                console.error(error);

                alert(
                    'Não foi possível adicionar o produto.'
                );

            }

        }

        document
            .getElementById(
                'searchForm'
            )
            .addEventListener(
                'submit',
                event => {

                    event.preventDefault();


                    const search =
                        document
                            .getElementById(
                                'searchInput'
                            )
                            .value
                            .trim();


                    if (!search) {

                        carregarProdutos();

                        return;

                    }


                    const url =
                        `/api/produtos/?search=${
                            encodeURIComponent(
                                search
                            )
                        }`;


                    carregarProdutos(url);

                }
            );
        

        logoutButton.addEventListener(
            'click',
            () => {

                localStorage.removeItem(
                    'access_token'
                );

                localStorage.removeItem(
                    'refresh_token'
                );


                window.location.href = '/';

            }
        );
        

        carregarUsuario();

        carregarProdutos();

    </script>

</body>

</html>
